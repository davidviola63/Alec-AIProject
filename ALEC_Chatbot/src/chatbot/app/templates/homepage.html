<!DOCTYPE html>
        <html lang="it">
        <head>
            <meta charset="UTF-8">
             <img src="../static/logo.png" alt="Logo ALEC" class="logo">
            <title>ALEC - Peer Tutor Simulation</title>
            <link rel="stylesheet" href="../static/style.css">
        </head>
        <body>
            <main>
                <div class="log" id="log"></div>

                <div class="input-area">
                    <select id="speaker">
                        <option value="Davide">Davide</option>
                        <option value="Marcello">Marcello</option>
                    </select>
                    <textarea id="msg" placeholder="Scrivi un messaggio..."></textarea><br/>
                    <button onclick="send()" id="sendBtn">Invia</button>
                </div>
            </main>

            <footer>
                <p>💬 Progetto universitario — Peer Learning con ALEC</p>
            </footer>

            <script>
                async function send() {
                    const speaker = document.getElementById('speaker').value;
                    const message = document.getElementById('msg').value.trim();
                    const log = document.getElementById('log');
                    const btn = document.getElementById('sendBtn');
                    if (!message) return;

                    // Mostra subito il messaggio dell'utente
                    log.innerHTML += `<div class="${speaker.toLowerCase()}"><b>${speaker}:</b> ${message}</div>`;
                    document.getElementById('msg').value = '';

                    // --- Intercetta comando /exit ---
                    const isExit = message.toLowerCase() === "/exit";
                    if (isExit) {
                        // Blocca subito UI
                        document.getElementById("msg").disabled = true;
                        btn.disabled = true;
                        btn.innerText = "Sessione chiusa 🔒";
                        btn.classList.add('disabled');
                        log.innerHTML += `<div><i>⏳ Generazione del report in corso...</i></div>`;
                    }

                    try {
                        const resp = await fetch('/message', {
                            method: 'POST',
                            headers: {'Content-Type': 'application/json'},
                            body: JSON.stringify({speaker, message})
                        });
                        const data = await resp.json();

                        // Mostra la risposta di ALEC
                        if (data.message) {
                            log.innerHTML += `<div class="alec"><b>ALEC → ${speaker}:</b> ${data.message}</div>`;
                        } else {
                            log.innerHTML += `<div><i>Errore:</i> ${JSON.stringify(data)}</div>`;
                        }

                        // --- Gestione flag session_closed dal server ---
                        if (data.session_closed === true && !isExit) {
                            document.getElementById("msg").disabled = true;
                            btn.disabled = true;
                            btn.innerText = "Sessione chiusa 🔒";
                            btn.classList.add('disabled');
                            log.innerHTML += `<div><i>🔒 Sessione terminata.</i></div>`;
                        }

                    } catch (err) {
                        log.innerHTML += `<div><i>Errore di rete:</i> ${err}</div>`;
                        if (!isExit) {
                            document.getElementById("msg").disabled = false;
                            btn.disabled = false;
                            btn.innerText = "Invia";
                            btn.classList.remove('disabled');
                        }
                    }

                    log.scrollTop = log.scrollHeight;
                }
            </script>
        </body>
</html>
